<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>계산기</title>
<style>
  :root {
    --bg: #eef1f5;
    --card: #ffffff;
    --text: #1d2330;
    --muted: #6b7385;
    --border: #dde2ea;
    --shadow: 0 10px 30px rgba(20, 30, 50, .12);
    --screen: #1e2533;
    --screen-text: #f4f6fa;
    --screen-muted: #9aa4b8;
    --error: #ff8a80;
    --key: #f2f4f8;
    --key-hover: #e4e8ef;
    --key-text: #1d2330;
    --op: #e3ecff;
    --op-hover: #d0dfff;
    --op-text: #2357d6;
    --fn: #fde8e6;
    --fn-hover: #fad3ce;
    --fn-text: #c2392b;
    --eq: #2f6bf0;
    --eq-hover: #2459cf;
    --eq-text: #ffffff;
    --item-hover: #f2f5fa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11151c;
      --card: #1a2029;
      --text: #e8ecf2;
      --muted: #8e98aa;
      --border: #2c3440;
      --shadow: 0 10px 30px rgba(0, 0, 0, .45);
      --screen: #0c0f14;
      --screen-text: #f4f6fa;
      --screen-muted: #8691a6;
      --key: #252c37;
      --key-hover: #2f3745;
      --key-text: #e8ecf2;
      --op: #1f2f52;
      --op-hover: #283b66;
      --op-text: #8fb3ff;
      --fn: #3d2224;
      --fn-hover: #4b2a2d;
      --fn-text: #ff9a8f;
      --eq: #3b78ff;
      --eq-hover: #5a8dff;
      --eq-text: #ffffff;
      --item-hover: #222935;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  }

  .app {
    display: flex;
    gap: 20px;
    align-items: stretch;
    width: 100%;
    max-width: 680px;
  }

  .card {
    background: var(--card);
    border-radius: 20px;
    box-shadow: var(--shadow);
  }

  /* 계산기 */
  .calculator {
    flex: 0 0 360px;
    padding: 18px;
  }

  .screen {
    background: var(--screen);
    border-radius: 14px;
    padding: 16px 18px 14px;
    margin-bottom: 16px;
    min-height: 124px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 6px;
    overflow: hidden;
  }
  .expression {
    color: var(--screen-muted);
    font-size: 18px;
    text-align: right;
    white-space: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
    min-height: 24px;
    font-variant-numeric: tabular-nums;
  }
  .expression::-webkit-scrollbar { display: none; }
  .result {
    color: var(--screen-text);
    font-size: 42px;
    font-weight: 600;
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-height: 52px;
    line-height: 52px;
    font-variant-numeric: tabular-nums;
  }
  .result.preview { color: var(--screen-muted); font-weight: 400; }
  .result.medium { font-size: 32px; }
  .result.small { font-size: 24px; }
  .result.error { color: var(--error); font-size: 24px; font-weight: 500; }

  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .keys button {
    height: 62px;
    border: none;
    border-radius: 14px;
    font: inherit;
    font-size: 24px;
    cursor: pointer;
    background: var(--key);
    color: var(--key-text);
    transition: background .12s, transform .06s;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .keys button:hover { background: var(--key-hover); }
  .keys button:active,
  .keys button.pressed { transform: scale(.95); }
  .keys button.op { background: var(--op); color: var(--op-text); }
  .keys button.op:hover { background: var(--op-hover); }
  .keys button.fn { background: var(--fn); color: var(--fn-text); font-size: 20px; font-weight: 600; }
  .keys button.fn:hover { background: var(--fn-hover); }
  .keys button.eq { background: var(--eq); color: var(--eq-text); font-weight: 600; }
  .keys button.eq:hover { background: var(--eq-hover); }
  .keys button:focus-visible,
  .history button:focus-visible {
    outline: 3px solid var(--eq);
    outline-offset: 2px;
  }

  /* 계산 기록 */
  .history {
    flex: 1 1 auto;
    min-width: 0;
    padding: 18px 14px 14px;
    display: flex;
    flex-direction: column;
  }
  .history-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6px 10px;
    border-bottom: 1px solid var(--border);
  }
  .history-header h2 { margin: 0; font-size: 17px; }
  .clear-history {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 8px;
    padding: 6px 10px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .clear-history:hover:not(:disabled) { color: var(--fn-text); border-color: var(--fn-text); }
  .clear-history:disabled { opacity: .45; cursor: default; }

  .history-list {
    list-style: none;
    margin: 0;
    padding: 6px 0 0;
    overflow-y: auto;
    flex: 1 1 0;
    min-height: 0;
  }
  .history-item {
    display: block;
    width: 100%;
    text-align: right;
    border: none;
    background: transparent;
    color: var(--text);
    font: inherit;
    padding: 10px 8px;
    border-radius: 10px;
    cursor: pointer;
  }
  .history-item:hover { background: var(--item-hover); }
  .history-expr {
    color: var(--muted);
    font-size: 14px;
    word-break: break-all;
  }
  .history-result {
    font-size: 20px;
    font-weight: 600;
    word-break: break-all;
  }
  .history-empty, .history-note {
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    padding: 24px 8px;
    margin: 0;
  }
  .history-note { padding: 8px 8px 0; font-size: 12px; }
  [hidden] { display: none !important; }

  @media (max-width: 700px) {
    .app { flex-direction: column; max-width: 400px; }
    .calculator { flex: none; }
    .history { max-height: 360px; }
    .history-list { flex: 1 1 auto; }
  }
  @media (max-width: 380px) {
    .calculator { padding: 14px; }
    .keys { gap: 8px; }
    .keys button { height: 56px; font-size: 22px; }
    .result { font-size: 36px; }
  }
</style>
</head>
<body>
<main class="app">
  <section class="calculator card" aria-label="계산기">
    <div class="screen">
      <div class="expression" id="expression" aria-label="입력 중인 수식">&nbsp;</div>
      <div class="result" id="result" aria-live="polite" aria-label="결과">0</div>
    </div>
    <div class="keys">
      <button type="button" class="fn" data-action="clear" data-key="Escape" title="모두 지우기 (Esc)">C</button>
      <button type="button" class="fn" data-action="backspace" data-key="Backspace" title="한 글자 지우기 (Backspace)">←</button>
      <button type="button" class="op" data-action="paren" data-value="(" data-key="(">(</button>
      <button type="button" class="op" data-action="paren" data-value=")" data-key=")">)</button>

      <button type="button" data-action="digit" data-value="7" data-key="7">7</button>
      <button type="button" data-action="digit" data-value="8" data-key="8">8</button>
      <button type="button" data-action="digit" data-value="9" data-key="9">9</button>
      <button type="button" class="op" data-action="op" data-value="÷" data-key="/" aria-label="나누기">÷</button>

      <button type="button" data-action="digit" data-value="4" data-key="4">4</button>
      <button type="button" data-action="digit" data-value="5" data-key="5">5</button>
      <button type="button" data-action="digit" data-value="6" data-key="6">6</button>
      <button type="button" class="op" data-action="op" data-value="×" data-key="*" aria-label="곱하기">×</button>

      <button type="button" data-action="digit" data-value="1" data-key="1">1</button>
      <button type="button" data-action="digit" data-value="2" data-key="2">2</button>
      <button type="button" data-action="digit" data-value="3" data-key="3">3</button>
      <button type="button" class="op" data-action="op" data-value="−" data-key="-" aria-label="빼기">−</button>

      <button type="button" data-action="digit" data-value="0" data-key="0">0</button>
      <button type="button" data-action="dot" data-key="." aria-label="소수점">.</button>
      <button type="button" class="eq" data-action="equals" data-key="Enter" title="계산 (Enter)">=</button>
      <button type="button" class="op" data-action="op" data-value="+" data-key="+" aria-label="더하기">+</button>
    </div>
  </section>

  <section class="history card" aria-label="계산 기록">
    <div class="history-header">
      <h2>계산 기록</h2>
      <button type="button" class="clear-history" id="clearHistory">기록 지우기</button>
    </div>
    <p class="history-empty" id="historyEmpty">아직 계산 기록이 없습니다.</p>
    <ul class="history-list" id="historyList"></ul>
    <p class="history-note" id="storageNote" hidden>이 브라우저에서는 기록을 저장할 수 없어, 창을 닫으면 기록이 사라집니다.</p>
  </section>
</main>

<script>
(function () {
  'use strict';

  var OPERATORS = '+−×÷';
  var STORAGE_KEY = 'calculator-claude-history';
  var MAX_HISTORY = 100;
  var MAX_LENGTH = 120;

  var expressionEl = document.getElementById('expression');
  var resultEl = document.getElementById('result');
  var historyListEl = document.getElementById('historyList');
  var historyEmptyEl = document.getElementById('historyEmpty');
  var clearHistoryBtn = document.getElementById('clearHistory');
  var storageNoteEl = document.getElementById('storageNote');

  // 계산 상태
  var expr = '';          // 입력 중인 수식 (화면 표시용 기호 + − × ÷ 사용)
  var evaluated = false;  // = 을 눌러 결과가 표시된 상태인지
  var outcome = null;     // { ok: true, value } 또는 { ok: false, message }
  var history = [];       // [{ expr, value }] 최신 기록이 앞
  var storageOk = true;

  /* ---------- 수식 계산 (eval 미사용) ---------- */

  function DivideByZeroError() {}

  function tokenize(s) {
    var tokens = [];
    var i = 0;
    while (i < s.length) {
      var c = s.charAt(i);
      if (/[0-9.]/.test(c)) {
        var m = /^(\d*\.?\d*)(e[+\-]?\d+)?/.exec(s.slice(i));
        if (!m[1] || m[1] === '.') throw new SyntaxError('bad number');
        tokens.push({ type: 'num', value: parseFloat(m[0]) });
        i += m[0].length;
      } else if (OPERATORS.indexOf(c) >= 0 || c === '(' || c === ')') {
        tokens.push({ type: c });
        i++;
      } else {
        throw new SyntaxError('bad character');
      }
    }
    return tokens;
  }

  // 부동소수점 오차 정리: 유효숫자 15자리로 반올림 (0.1+0.2 → 0.3)
  function clean(v) {
    if (!isFinite(v)) return v;
    v = parseFloat(v.toPrecision(15));
    return v === 0 ? 0 : v; // -0 제거
  }

  // 우선순위: 괄호 > 부호 > ×÷ > +−
  function evaluate(s) {
    var tokens = tokenize(s);
    var pos = 0;

    function peek() { return tokens[pos] && tokens[pos].type; }

    function parseExpression() {
      var v = parseTerm();
      while (peek() === '+' || peek() === '−') {
        var op = tokens[pos++].type;
        var r = parseTerm();
        v = clean(op === '+' ? v + r : v - r);
      }
      return v;
    }

    function parseTerm() {
      var v = parseFactor();
      while (peek() === '×' || peek() === '÷') {
        var op = tokens[pos++].type;
        var r = parseFactor();
        if (op === '×') {
          v = clean(v * r);
        } else {
          if (r === 0) throw new DivideByZeroError();
          v = clean(v / r);
        }
      }
      return v;
    }

    function parseFactor() {
      if (peek() === '−') { pos++; return -parseFactor(); }
      if (peek() === '+') { pos++; return parseFactor(); }
      return parsePrimary();
    }

    function parsePrimary() {
      var t = tokens[pos];
      if (!t) throw new SyntaxError('unexpected end');
      if (t.type === 'num') { pos++; return t.value; }
      if (t.type === '(') {
        pos++;
        var v = parseExpression();
        if (peek() !== ')') throw new SyntaxError('missing )');
        pos++;
        return v;
      }
      throw new SyntaxError('unexpected token');
    }

    var value = parseExpression();
    if (pos !== tokens.length) throw new SyntaxError('trailing tokens');
    return clean(value);
  }

  /* ---------- 숫자 표시 ---------- */

  // 결과 표시용: 천 단위 쉼표, 음수 기호는 −
  function formatNumber(v) {
    var s = String(v);
    if (/e/.test(s)) return s.replace(/^-/, '−');
    var negative = s.charAt(0) === '-';
    if (negative) s = s.slice(1);
    var parts = s.split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (negative ? '−' : '') + parts.join('.');
  }

  // 결과를 다시 수식에 넣을 때 쓰는 형태 (쉼표 없음)
  function toExpression(v) {
    return String(v).replace(/^-/, '−');
  }

  /* ---------- 입력 처리 ---------- */

  function lastChar() { return expr.charAt(expr.length - 1); }
  function isOperator(c) { return c !== '' && OPERATORS.indexOf(c) >= 0; }
  function isDigit(c) { return /[0-9]/.test(c); }
  function currentNumber() { return /[0-9.]*$/.exec(expr)[0]; }

  function openParenCount() {
    var count = 0;
    for (var i = 0; i < expr.length; i++) {
      if (expr.charAt(i) === '(') count++;
      else if (expr.charAt(i) === ')') count--;
    }
    return count;
  }

  function closeParens(s) {
    var count = 0;
    for (var i = 0; i < s.length; i++) {
      if (s.charAt(i) === '(') count++;
      else if (s.charAt(i) === ')') count--;
    }
    while (count-- > 0) s += ')';
    return s;
  }

  // 결과가 표시된 뒤 새 수식을 시작
  function startFresh() {
    if (evaluated) {
      expr = '';
      evaluated = false;
      outcome = null;
    }
  }

  function inputDigit(d) {
    startFresh();
    if (expr.length >= MAX_LENGTH) return;
    if (lastChar() === ')') expr += '×';
    if (currentNumber() === '0') {
      if (d === '0') return;
      expr = expr.slice(0, -1) + d; // 앞자리 0 대체
      return;
    }
    expr += d;
  }

  function inputDot() {
    startFresh();
    if (expr.length >= MAX_LENGTH) return;
    if (currentNumber().indexOf('.') >= 0) return; // 한 숫자에 소수점은 한 번만
    if (lastChar() === ')') expr += '×';
    expr += currentNumber() === '' ? '0.' : '.';
  }

  function inputOperator(op) {
    if (evaluated) {
      // 결과에 이어서 계산 (오류였다면 새로 시작)
      expr = outcome && outcome.ok ? toExpression(outcome.value) : '';
      evaluated = false;
      outcome = null;
    }
    if (expr.length >= MAX_LENGTH) return;

    // 3×−2 처럼 곱셈·나눗셈 뒤 음수 입력 허용
    if (op === '−' && (lastChar() === '×' || lastChar() === '÷')) {
      expr += op;
      return;
    }
    // 연산자를 연속으로 누르면 마지막 연산자로 교체
    while (isOperator(lastChar())) expr = expr.slice(0, -1);
    if (expr === '' || lastChar() === '(') {
      if (op === '−') expr += op; // 맨 앞이나 괄호 뒤에는 음수 부호만 허용
      return;
    }
    expr += op;
  }

  function inputParen(p) {
    if (p === '(') {
      startFresh();
      if (expr.length >= MAX_LENGTH) return;
      var c = lastChar();
      expr += (isDigit(c) || c === '.' || c === ')') ? '×(' : '(';
    } else {
      if (evaluated) return;
      var last = lastChar();
      if (openParenCount() > 0 && (isDigit(last) || last === '.' || last === ')')) {
        expr += ')';
      }
    }
  }

  function backspace() {
    if (evaluated) {
      // 결과 상태에서 ← 를 누르면 방금 수식을 다시 편집
      evaluated = false;
      outcome = null;
    }
    expr = expr.slice(0, -1);
  }

  function clearAll() {
    expr = '';
    evaluated = false;
    outcome = null;
  }

  function calculate(s) {
    try {
      if (s === '' || /[+−×÷(]$/.test(s)) throw new SyntaxError('incomplete');
      var value = evaluate(s);
      if (!isFinite(value)) return { ok: false, message: '결과가 너무 큽니다' };
      return { ok: true, value: value };
    } catch (e) {
      if (e instanceof DivideByZeroError) return { ok: false, message: '0으로 나눌 수 없습니다' };
      return { ok: false, message: '수식이 올바르지 않습니다' };
    }
  }

  function equals() {
    if (evaluated || expr === '') return;
    var full = closeParens(expr); // 닫지 않은 괄호는 자동으로 닫음
    outcome = calculate(full);
    expr = full;
    evaluated = true;
    if (outcome.ok) addHistory(full, outcome.value);
  }

  /* ---------- 화면 ---------- */

  function setResult(text, kind) {
    resultEl.textContent = text;
    resultEl.className = 'result';
    if (kind) resultEl.classList.add(kind);
    if (kind !== 'error') {
      if (text.length > 18) resultEl.classList.add('small');
      else if (text.length > 12) resultEl.classList.add('medium');
    }
  }

  function render() {
    if (evaluated) {
      expressionEl.textContent = expr + ' =';
      if (outcome.ok) setResult(formatNumber(outcome.value));
      else setResult(outcome.message, 'error');
    } else {
      expressionEl.textContent = expr || ' ';
      if (expr === '') {
        setResult('0');
      } else {
        // 입력 중에는 미리보기 결과를 흐리게 표시
        var preview = /[+−×÷(]$/.test(expr) ? null : calculate(closeParens(expr));
        setResult(preview && preview.ok ? formatNumber(preview.value) : '', 'preview');
      }
    }
    expressionEl.scrollLeft = expressionEl.scrollWidth;
  }

  /* ---------- 계산 기록 ---------- */

  function loadHistory() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      var data = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(data)) return [];
      return data.filter(function (item) {
        return item && typeof item.expr === 'string' && typeof item.value === 'number';
      }).slice(0, MAX_HISTORY);
    } catch (e) {
      storageOk = false;
      return [];
    }
  }

  function saveHistory() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    } catch (e) {
      storageOk = false;
    }
    storageNoteEl.hidden = storageOk;
  }

  function addHistory(expression, value) {
    history.unshift({ expr: expression, value: value });
    if (history.length > MAX_HISTORY) history.length = MAX_HISTORY;
    saveHistory();
    renderHistory();
  }

  function renderHistory() {
    historyListEl.textContent = '';
    history.forEach(function (item, index) {
      var li = document.createElement('li');
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'history-item';
      btn.dataset.index = String(index);
      btn.title = '이 수식 다시 불러오기';

      var exprDiv = document.createElement('div');
      exprDiv.className = 'history-expr';
      exprDiv.textContent = item.expr + ' =';
      var resultDiv = document.createElement('div');
      resultDiv.className = 'history-result';
      resultDiv.textContent = formatNumber(item.value);

      btn.appendChild(exprDiv);
      btn.appendChild(resultDiv);
      li.appendChild(btn);
      historyListEl.appendChild(li);
    });
    historyEmptyEl.hidden = history.length > 0;
    clearHistoryBtn.disabled = history.length === 0;
  }

  historyListEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.history-item');
    if (!btn) return;
    var item = history[Number(btn.dataset.index)];
    if (!item) return;
    expr = item.expr;
    evaluated = false;
    outcome = null;
    render();
  });

  clearHistoryBtn.addEventListener('click', function () {
    if (history.length === 0) return;
    if (!window.confirm('계산 기록을 모두 지울까요?')) return;
    history = [];
    saveHistory();
    renderHistory();
  });

  /* ---------- 버튼과 키보드 ---------- */

  function runAction(action, value) {
    switch (action) {
      case 'digit': inputDigit(value); break;
      case 'dot': inputDot(); break;
      case 'op': inputOperator(value); break;
      case 'paren': inputParen(value); break;
      case 'clear': clearAll(); break;
      case 'backspace': backspace(); break;
      case 'equals': equals(); break;
    }
    render();
  }

  document.querySelector('.keys').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    runAction(btn.dataset.action, btn.dataset.value);
  });

  var keyButtons = {};
  document.querySelectorAll('.keys button[data-key]').forEach(function (btn) {
    keyButtons[btn.dataset.key] = btn;
  });

  var KEY_ALIASES ={ '=': 'Enter', 'Delete': 'Escape', 'x': '*', 'X': '*', ',': '.' };

  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var key = KEY_ALIASES[e.key] || e.key;
    var btn = keyButtons[key];
    if (!btn) return;
    e.preventDefault(); // 포커스된 버튼이 Enter로 함께 눌리는 것 방지
    runAction(btn.dataset.action, btn.dataset.value);
    btn.classList.add('pressed');
    setTimeout(function () { btn.classList.remove('pressed'); }, 120);
  });

  history = loadHistory();
  storageNoteEl.hidden = storageOk;
  renderHistory();
  render();
})();
</script>
</body>
</html>
