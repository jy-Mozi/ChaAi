<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>송재영 | 개발자 포트폴리오</title>
  <meta name="description" content="20년차 개발자 송재영의 경력, 기술 스택, 포트폴리오를 소개합니다.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="송재영 | 개발자 포트폴리오">
  <meta property="og:description" content="20년차 개발자의 경력, 기술 스택, 포트폴리오">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // 저장된 테마를 먼저 적용해 깜빡임을 막는다. 저장값이 없으면 시스템 설정을 따른다.
    (function () {
      let t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#about">본문으로 건너뛰기</a>
  <div class="progress" id="progress" aria-hidden="true"></div>

  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="#hero"><span class="logo-mark" aria-hidden="true">&lt;/&gt;</span><span data-bind="name"></span></a>
      <nav class="nav" id="nav" aria-label="주요 메뉴">
        <a href="#about">소개</a>
        <a href="#skills">기술</a>
        <a href="#experience">경력</a>
        <a href="#projects">프로젝트</a>
        <a href="#contact">연락처</a>
      </nav>
      <div class="header-actions">
        <button class="theme-switch" id="theme-toggle" type="button" aria-label="다크 모드" aria-pressed="false">
          <span class="theme-knob">
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </span>
        </button>
        <button class="icon-btn menu-btn" id="menu-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="nav">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section id="hero" class="hero">
      <div class="hero-bg" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="grid-pattern"></div>
      </div>
      <div class="container hero-inner">
        <div class="hero-text">
          <p class="status" id="status"><span class="status-dot"></span><span data-bind="status"></span></p>
          <p class="eyebrow" data-bind="title"></p>
          <h1 class="hero-title">안녕하세요,<br><span class="gradient-text" data-bind="name"></span>입니다.</h1>
          <p class="hero-tagline" data-bind="tagline"></p>
          <div class="hero-actions">
            <a class="btn btn-primary" href="#projects">포트폴리오 보기 <span aria-hidden="true">→</span></a>
            <a class="btn btn-ghost js-tel" href="#contact"><svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>전화 연락하기</a>
          </div>
        </div>
        <div class="code-window" aria-hidden="true">
          <div class="code-bar">
            <span class="dot dot-r"></span><span class="dot dot-y"></span><span class="dot dot-g"></span>
            <span class="code-file">developer.js</span>
          </div>
          <pre class="code"><code id="code"></code><span class="caret"></span></pre>
        </div>
      </div>
      <a class="scroll-hint" href="#about" aria-label="아래로 스크롤"><span></span></a>
    </section>

    <div class="marquee" aria-hidden="true">
      <div class="marquee-track" id="marquee"></div>
    </div>

    <section id="about" class="section">
      <div class="container">
        <div class="section-head reveal">
          <span class="section-num">01</span>
          <h2 class="section-title">소개</h2>
        </div>
        <div class="about">
          <div class="avatar-wrap reveal">
            <div class="avatar" id="avatar"></div>
          </div>
          <div class="reveal">
            <div class="about-text" id="about-text"></div>
            <dl class="stats" id="stats"></dl>
          </div>
        </div>
      </div>
    </section>

    <section id="skills" class="section section-alt">
      <div class="container">
        <div class="section-head reveal">
          <span class="section-num">02</span>
          <h2 class="section-title">기술 스택</h2>
        </div>
        <div class="skills-layout">
          <div class="levels card reveal" id="levels">
            <h3 class="card-title">핵심 역량</h3>
          </div>
          <div class="skills" id="skills-list"></div>
        </div>
      </div>
    </section>

    <section id="experience" class="section">
      <div class="container">
        <div class="section-head reveal">
          <span class="section-num">03</span>
          <h2 class="section-title">경력</h2>
        </div>
        <ol class="timeline" id="timeline"></ol>
      </div>
    </section>

    <section id="projects" class="section section-alt">
      <div class="container">
        <div class="section-head reveal">
          <span class="section-num">04</span>
          <h2 class="section-title">프로젝트</h2>
        </div>
        <div class="filters reveal" id="filters" role="group" aria-label="프로젝트 분야 필터"></div>
        <div class="projects" id="project-list"></div>
      </div>
    </section>

    <section id="contact" class="section">
      <div class="container">
        <div class="contact-card reveal">
          <span class="section-num">05</span>
          <h2 class="contact-title">함께 일해요</h2>
          <p class="contact-lead">새로운 프로젝트, 협업, 채용 제안 모두 환영합니다.</p>
          <a class="phone js-tel" id="phone-link"><svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg><span id="phone-text"></span></a>
          <div class="email-row">
            <a class="email" id="email-link"></a>
            <button class="btn btn-light btn-sm" id="copy-email" type="button">복사</button>
          </div>
          <ul class="links" id="links"></ul>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">© <span id="year"></span> <span data-bind="name"></span> · Built with plain HTML, CSS &amp; JS</div>
  </footer>

  <button class="to-top" id="to-top" type="button" aria-label="맨 위로">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
